name: Issue to PR

on:
  issues:
    types: [opened]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Create branch for issue
        run: |
          BRANCH_NAME="issue-${{ github.event.issue.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git commit --allow-empty -m "Initialize branch for issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            try {
              const { data: repo } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue.title,
                body: `Closes #${issue.number}\n\n${issue.body || ''}`,
                head: `issue-${issue.number}`,
                base: repo.default_branch,
              });
            } catch (error) {
              core.setFailed(`Failed to create pull request: ${error.message}`);
            }
